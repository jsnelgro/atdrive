name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh
      - name: Build app bundle (unsigned; checks it assembles)
        run: ALLOW_ADHOC=1 CONFIG=debug scripts/build-app.sh
