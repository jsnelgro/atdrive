name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh

  # The released Linux binaries are static (musl): catch what breaks that before a release does.
  static-linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble # a version with an SDK listed in scripts/build-static.sh
    steps:
      - uses: actions/checkout@v4
      - name: Static build (x86_64)
        run: scripts/build-static.sh x86_64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh
      - name: Build app bundle (unsigned; checks it assembles)
        run: ALLOW_ADHOC=1 CONFIG=debug scripts/build-app.sh
