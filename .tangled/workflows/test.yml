# Tests, on pushes to main and on pull requests, in the flake's dev shell (nixpkgs' Swift 6.4.0):
# the same scripts/test.sh as everywhere, on a plain drive then an encrypted one.
when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

steps:
  - name: Test
    command: nix --extra-experimental-features "nix-command flakes" develop --command scripts/test.sh
  - name: Build
    command: nix --extra-experimental-features "nix-command flakes" build .#atdrive
